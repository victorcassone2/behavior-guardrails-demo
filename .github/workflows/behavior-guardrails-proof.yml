# Shows that Behavioral Guardrails' tests can fail. Started by the app for one check:
# it runs the chosen tests on the unchanged code, then again with the application
# code broken on purpose, one break at a time. The breaks exist only inside this run;
# nothing is committed or pushed. The results are uploaded for the app to read.
name: Behavior Guardrails proof
run-name: Behavior Guardrails proof ${{ inputs.check_id }}

on:
  workflow_dispatch:
    inputs:
      check_id:
        description: Set by Behavioral Guardrails
        required: true
        type: string
      breaks:
        description: Set by Behavioral Guardrails (JSON)
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Run the tests with the code broken on purpose
        env:
          BREAKS: ${{ inputs.breaks }}
          VITEST: npx vitest
        run: |
          cat > "$RUNNER_TEMP/behavior-guardrails-proof.mjs" <<'SCRIPT'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          import { isAbsolute, normalize } from "node:path";

          const out = "behavior-guardrails/proof";
          mkdirSync(out, { recursive: true });
          const [cmd, ...prefix] = (process.env.VITEST || "npx vitest").split(" ");
          const breaks = JSON.parse(process.env.BREAKS || "[]");
          const safe = (p) => typeof p === "string" && p !== "" && !isAbsolute(p) && !normalize(p).startsWith("..");
          const vitest = (name, files) => {
            // With no file filter Vitest would run the whole suite, which proves nothing about these tests.
            if (files.length === 0) return;
            spawnSync(cmd, [...prefix, "run", "--reporter=default", "--reporter=junit", "--outputFile.junit=" + out + "/" + name + ".xml", ...files], {
              stdio: "inherit",
            });
          };

          const manifest = [];
          vitest("baseline", [...new Set(breaks.flatMap((b) => (Array.isArray(b.tests) ? b.tests : [])))].filter(safe));
          for (const b of breaks) {
            const id = String(b.id);
            if (!/^b\d+$/.test(id) || !safe(b.path) || typeof b.find !== "string" || typeof b.replace !== "string" || !Array.isArray(b.tests)) {
              manifest.push({ id, applied: false, reason: "The break was not valid." });
              continue;
            }
            let original;
            try {
              original = readFileSync(b.path, "utf8");
            } catch {
              manifest.push({ id, applied: false, reason: b.path + " doesn't exist on this commit." });
              continue;
            }
            const at = b.find ? original.indexOf(b.find) : -1;
            if (at < 0 || original.indexOf(b.find, at + 1) >= 0) {
              const reason = at < 0 ? "The code to change isn't in " + b.path + " on this commit." : "The code to change appears more than once in " + b.path + ".";
              manifest.push({ id, applied: false, reason });
              continue;
            }
            writeFileSync(b.path, original.slice(0, at) + b.replace + original.slice(at + b.find.length));
            try {
              vitest(id, b.tests.filter(safe));
            } finally {
              writeFileSync(b.path, original);
            }
            manifest.push({ id, applied: true });
          }
          writeFileSync(out + "/manifest.json", JSON.stringify(manifest));
          SCRIPT
          node "$RUNNER_TEMP/behavior-guardrails-proof.mjs"
      - name: Upload proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-guardrails-proof
          path: behavior-guardrails/proof/
          if-no-files-found: warn
          retention-days: 30
